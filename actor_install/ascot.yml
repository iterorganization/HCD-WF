#example
# ASCOT suite: iWrap actors afsi, bbnbi_serial, bbnbi_parallel, ascot_serial and ascot_parallel.
# Modules: DD 4.1.1 / intel-2025b set of the ascot config_sdcc.sh file (the build uses ifx; for DD 3.42.2
# use the module set of config_sdcc_dd3_2025b.sh or config_sdcc_dd3_2023b.sh).
# The build exports IMAS_VERSION (DD of the IMAS-Fortran module), builds the optimized serial and parallel
# libraries without ASCOT-RFOF, and `make iwrap_actor_<actor>` generates each actor in $ACTOR_FOLDER from
# the yaml matching the compiler and the DD (actors/<actor>_ifx.yaml for DD 4).
---
SOURCES:
  - VCS:     git
    REPO:    ssh://git@git.iter.org/traj/ascot.git
    VERSION: feature/DD3_and_DD4
    DIR:     ascot

MODULES: [iWrap/2.0.0-intel-2025b, IMAS-Python/2.3.0-intel-2025b, IMAS-Fortran/5.6.0-intel-2025b-DD-4.1.1, MUSCLE3/0.10.0-intel-2025b, XMLlib/3.3.2-intel-compilers-2025.2.0]

BUILDS:
  - DIR: ascot
    CMD: export IMAS_VERSION=$(pkg-config --modversion al-fortran | cut -d- -f1) && ./build.sh -skip_rfof -libs -optimized

ACTORS:
  - DIR: ascot
    CMD:
      - export IMAS_VERSION=$(pkg-config --modversion al-fortran | cut -d- -f1) && make iwrap_actor_afsi
      - export IMAS_VERSION=$(pkg-config --modversion al-fortran | cut -d- -f1) && make iwrap_actor_bbnbi_serial
      - export IMAS_VERSION=$(pkg-config --modversion al-fortran | cut -d- -f1) && make iwrap_actor_bbnbi_parallel
      - export IMAS_VERSION=$(pkg-config --modversion al-fortran | cut -d- -f1) && make iwrap_actor_ascot_serial
      - export IMAS_VERSION=$(pkg-config --modversion al-fortran | cut -d- -f1) && make iwrap_actor_ascot_parallel
